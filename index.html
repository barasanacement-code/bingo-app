<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kena Bingo</title>
</head>
<body>

    <!-- የገንዘብ ማስገቢያ ቅጽ -->
    <div>
        <input type="number" id="deposit-amount" placeholder="የብር መጠን">
        <input type="text" id="deposit-sms" placeholder="SMS / Tx ID">
        <button onclick="submitDeposit()">Submit</button>
    </div>

    <!-- 👉 የ JavaScript ኮዱ የግድ በ <script> እና </script> መካከል መሆን አለበት -->
    <script>
    function submitDeposit() {
        const amountInput = document.getElementById('deposit-amount').value.trim();
        const smsInput = document.getElementById('deposit-sms').value.trim();
        const parsedAmount = parseFloat(amountInput);

        if (!amountInput || isNaN(parsedAmount) || parsedAmount <= 0) {
            alert("እባክዎን ትክክለኛ የብር መጠን ያስገቡ!");
            return;
        }

        const txRegex = /^[a-zA-Z0-9\s:-]+$/;
        if (!smsInput || !txRegex.test(smsInput)) {
            alert("እባክዎን ትክክለኛ የ SMS መልእክት ወይም Transaction ID ብቻ ያስገቡ!");
            return;
        }

        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()}`;
        
        const txId = db.ref().child('recharges').push().key;

        const depositData = {
            id: txId,
            userId: userId,
            userName: userName,
            method: selectedPaymentMethod,
            amount: parsedAmount.toFixed(2),
            sms_text: smsInput,
            date: dateStr,
            status: 'PENDING',
            timestamp: Date.now()
        };

        db.ref('recharges/' + txId).set(depositData);
        db.ref('transactions/' + userId + '/' + txId).set(depositData);

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.sendData(JSON.stringify({
                action: "deposit_request",
                tx_id: txId,
                user_id: userId,
                user_name: userName,
                method: selectedPaymentMethod,
                amount: parsedAmount.toFixed(2),
                sms_text: smsInput
            }));
        }

        alert("የገንዘብ ማስገቢያ ጥያቄዎ በትክክል ተልኳል!");
        document.getElementById('deposit-amount').value = '';
        document.getElementById('deposit-sms').value = '';
    }
    <script src="script.js"></script>
</body>
</html>
