<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Bingo Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --gold-color: #f59e0b;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            color: var(--gold-color);
            font-size: 24px;
            margin: 5px 0;
        }

        .wallet-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px 20px;
            width: 90%;
            max-width: 350px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .btn-deposit {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 350px;
            width: 100%;
        }

        .header-cell {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            padding: 10px 0;
            border-radius: 6px;
        }

        .cell {
            background-color: #334155;
            color: white;
            font-size: 16px;
            font-weight: bold;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell.marked {
            background-color: var(--gold-color);
            color: #000;
            transform: scale(0.95);
        }

        .cell.free {
            background-color: #ef4444;
            color: white;
            font-size: 12px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 350px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-bingo {
            background-color: var(--gold-color);
            color: black;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎲 ATS BINGO 🎲</h1>
        <p style="margin:0; color:#94a3b8;">ካርድ #<span id="card-num">105</span></p>
    </div>

    <div class="wallet-card">
        <div>
            <div style="font-size: 12px; color: #94a3b8;">የቀረዉ ሒሳብ</div>
            <div style="font-size: 18px; font-weight: bold;"><span id="balance">0.00</span> ETB</div>
        </div>
        <button class="btn-deposit" onclick="depositMoney()">💳 ብር አስገባ</button>
    </div>

    <div class="bingo-board" id="board">
        <!-- Headers -->
        <div class="header-cell">B</div>
        <div class="header-cell">I</div>
        <div class="header-cell">N</div>
        <div class="header-cell">G</div>
        <div class="header-cell">O</div>
        <!-- Numbers will be loaded dynamically -->
    </div>

    <div class="actions">
        <button class="btn-action btn-bingo" onclick="claimBingo()">🏆 BINGO!</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // አፑን ሙሉ ስክሪን ለማድረግ

        // የናሙና ቢንጎ ካርድ ቁጥሮች
        const sampleCard = [
            [5, 22, 35, 50, 65],
            [12, 18, 41, 55, 70],
            [3, 29, "FREE", 48, 61],
            [8, 25, 39, 52, 68],
            [14, 30, 44, 59, 75]
        ];

        const board = document.getElementById('board');

        // ካርዱን በግራፊክስ መሳል
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                const val = sampleCard[r][c];
                const cell = document.createElement('div');
                cell.className = 'cell' + (val === "FREE" ? ' free marked' : '');
                cell.innerText = val;
                
                if (val !== "FREE") {
                    cell.onclick = () => cell.classList.toggle('marked');
                }
                board.appendChild(cell);
            }
        }

        function depositMoney() {
            tg.sendData(JSON.stringify({ action: "deposit" }));
            alert("የባንክ ክፍያ ገፅ በመከፈት ላይ ነው...");
        }

        function claimBingo() {
            tg.sendData(JSON.stringify({ action: "bingo_claim" }));
            alert("BINGO ጥያቄዎ ለቦቱ ተልኳል!");
        }
    </script>
</body>
</html>
